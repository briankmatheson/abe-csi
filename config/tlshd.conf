# tlshd configuration for NVMe/TCP TLS support
# This daemon handles TLS 1.3 handshakes for in-kernel NVMe/TCP

[authenticate]
# Use the .nvme kernel keyring for PSK storage
keyrings = .nvme

# TLS 1.3 PSK with (EC)DHE key exchange
# Cipher suite: TLS_AES_128_GCM_SHA256 (mandatory for NVMe/TCP TLS)

[verify]
# Peer verification settings
# For PSK-based auth, this is minimal
# In production, consider additional verification

# Log level (optional)
# debug = 0
