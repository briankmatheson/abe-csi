apiVersion: v1
kind: Pod
metadata:
  name: debian-test
spec:
  # single-node clusters only have a tainted control plane
  tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
  containers:
  - name: debian
    image: debian:12-slim
    command: ["/bin/bash", "-c", "sleep infinity"]
    volumeMounts:
    - name: data
      mountPath: /data
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: pgdata   # k8s/pvc.yaml
