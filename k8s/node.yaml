apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: abe-csi-node
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: abe-csi-node
  template:
    metadata:
      labels:
        app: abe-csi-node
    spec:
      serviceAccountName: csi-node-sa
      hostNetwork: true
      priorityClassName: system-node-critical
      # Every node that can run a pod needs the node plugin, taints or not
      tolerations:
      - operator: Exists
      containers:
      - name: abe-csi
        image: registry.mesh.harlem.bmath.nyc/abe-csi:0.3.1
        args:
        - "--endpoint=unix:///csi/csi.sock"
        env:
        - name: NODE_ID
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: XDEBBIE_URL
          valueFrom:
            secretKeyRef: {name: abe-csi-xdebbie, key: url}
        - name: XDEBBIE_TOKEN
          valueFrom:
            secretKeyRef: {name: abe-csi-xdebbie, key: token}
        securityContext:
          privileged: true
        volumeMounts:
        - name: plugin-dir
          mountPath: /csi
        - name: mountpoint-dir
          mountPath: /var/lib/kubelet/pods
          mountPropagation: Bidirectional
        # The VM's /dev: hot-plugged virtio disks show up here, and
        # cryptsetup/mount need the real device nodes.
        - name: dev
          mountPath: /dev
        # SMBIOS product_uuid = our VM id in xdebbied.
        - name: dmi
          mountPath: /sys/class/dmi/id
          readOnly: true
      - name: csi-node-driver-registrar
        image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.10.0
        args:
        - "--csi-address=unix:///csi/csi.sock"
        - "--kubelet-registration-path=/var/lib/kubelet/plugins/abe.csi/csi.sock"
        volumeMounts:
        - name: plugin-dir
          mountPath: /csi
        - name: registration-dir
          mountPath: /registration
      volumes:
      - name: plugin-dir
        hostPath:
          path: /var/lib/kubelet/plugins/abe.csi
          type: DirectoryOrCreate
      - name: registration-dir
        hostPath:
          path: /var/lib/kubelet/plugins_registry
          type: Directory
      - name: mountpoint-dir
        hostPath:
          path: /var/lib/kubelet/pods
          type: Directory
      - name: dev
        hostPath:
          path: /dev
      - name: dmi
        hostPath:
          path: /sys/class/dmi/id
