apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: abe-csi-node
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: abe-csi-node
  template:
    metadata:
      labels:
        app: abe-csi-node
    spec:
      serviceAccountName: csi-node-sa
      hostNetwork: true
      containers:
      - name: abe-csi
        image: registry.internal.timesink.harlem.brianmatheson.com/abe-csi:latest
        args:
        - "--endpoint=unix:///csi/csi.sock"
        env:
        - name: NODE_ID
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        securityContext:
          privileged: true
        volumeMounts:
        - name: plugin-dir
          mountPath: /csi
        - name: mountpoint-dir
          mountPath: /var/lib/kubelet/pods
          mountPropagation: Bidirectional
        - name: dev
          mountPath: /dev
        - name: modules
          mountPath: /lib/modules
          readOnly: true
        - name: abe-state
          mountPath: /var/lib/abe
      - name: csi-node-driver-registrar
        image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.10.0
        args:
        - "--csi-address=unix:///csi/csi.sock"
        - "--kubelet-registration-path=/var/lib/kubelet/plugins/abe.csi.briankmatheson/csi.sock"
        volumeMounts:
        - name: plugin-dir
          mountPath: /csi
        - name: registration-dir
          mountPath: /registration
      volumes:
      - name: plugin-dir
        hostPath:
          path: /var/lib/kubelet/plugins/abe.csi.briankmatheson
          type: DirectoryOrCreate
      - name: registration-dir
        hostPath:
          path: /var/lib/kubelet/plugins_registry
          type: Directory
      - name: mountpoint-dir
        hostPath:
          path: /var/lib/kubelet/pods
          type: Directory
      - name: dev
        hostPath:
          path: /dev
      - name: modules
        hostPath:
          path: /lib/modules
      - name: abe-state
        hostPath:
          path: /var/lib/abe-csi/node
          type: DirectoryOrCreate
