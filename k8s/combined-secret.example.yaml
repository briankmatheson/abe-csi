---
# Example secret containing both TLS PSK and LUKS passphrase
# for defense-in-depth encryption (transport + at-rest)
#
# Generate keys securely:
#   PSK=$(nvme gen-tls-key --output=- | base64 -w0)
#   LUKS_PASS=$(openssl rand -base64 48)
#
#   kubectl create secret generic abe-combined-secrets \
#     --from-literal=tls-psk="$PSK" \
#     --from-literal=passphrase="$LUKS_PASS" \
#     --namespace=kube-system
apiVersion: v1
kind: Secret
metadata:
  name: abe-combined-secrets
  namespace: kube-system
type: Opaque
stringData:
  # TLS Pre-Shared Key (base64-encoded) for NVMe/TCP transport encryption
  tls-psk: "REPLACE_WITH_ACTUAL_PSK_BASE64"
  
  # LUKS passphrase for at-rest encryption
  passphrase: "REPLACE_WITH_ACTUAL_LUKS_PASSPHRASE"
