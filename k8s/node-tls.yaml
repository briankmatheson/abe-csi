---
# DaemonSet with TLS support for NVMe/TCP
# This version includes configuration for running tlshd daemon
# and ensures TLS capabilities are available on nodes
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: abe-csi-node
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: abe-csi-node
  template:
    metadata:
      labels:
        app: abe-csi-node
    spec:
      serviceAccountName: csi-node-sa
      hostNetwork: true
      # Optional: node selector for TLS-capable nodes
      # nodeSelector:
      #   abe.csi.briankmatheson/tls: "true"
      # Use this label on nodes with kernel 6.7+ for TLS support
      initContainers:
      # Check for TLS support and log warnings if not available
      - name: tls-check
        image: registry.internal.timesink.harlem.brianmatheson.com/abe-csi:latest
        command:
        - /bin/bash
        - -c
        - |
          echo "Checking NVMe/TCP TLS support..."
          KERNEL_VERSION=$(uname -r)
          echo "Kernel version: $KERNEL_VERSION"
          
          # Check kernel version (need 6.7+)
          MAJOR=$(echo $KERNEL_VERSION | cut -d. -f1)
          MINOR=$(echo $KERNEL_VERSION | cut -d. -f2)
          if [ "$MAJOR" -lt 6 ] || [ "$MAJOR" -eq 6 -a "$MINOR" -lt 7 ]; then
            echo "WARNING: Kernel $KERNEL_VERSION < 6.7 - NVMe/TCP TLS not supported"
            echo "TLS connections will be unavailable on this node"
          else
            echo "✓ Kernel supports NVMe/TCP TLS"
          fi
          
          # Check nvme-cli TLS support
          if nvme gen-tls-key --help &>/dev/null; then
            echo "✓ nvme-cli supports TLS commands"
          else
            echo "WARNING: nvme-cli doesn't support TLS (need version 2.8+)"
          fi
          
          # Check if tlshd is available
          if command -v tlshd &>/dev/null; then
            echo "✓ tlshd binary found"
          else
            echo "WARNING: tlshd not found - install for TLS handshake support"
          fi
          
          echo "TLS support check complete"
        securityContext:
          privileged: true
      containers:
      - name: abe-csi
        image: registry.internal.timesink.harlem.brianmatheson.com/abe-csi:latest
        args:
        - "--endpoint=unix:///csi/csi.sock"
        env:
        - name: NODE_ID
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        securityContext:
          privileged: true
        volumeMounts:
        - name: plugin-dir
          mountPath: /csi
        - name: mountpoint-dir
          mountPath: /var/lib/kubelet/pods
          mountPropagation: Bidirectional
        - name: dev
          mountPath: /dev
        - name: modules
          mountPath: /lib/modules
          readOnly: true
        - name: abe-state
          mountPath: /var/lib/abe
      
      # Optional: tlshd daemon sidecar
      # Uncomment if tlshd is available and you want it running as a sidecar
      # - name: tlshd
      #   image: registry.internal.timesink.harlem.brianmatheson.com/tlshd:latest
      #   command:
      #   - /usr/sbin/tlshd
      #   - --config=/etc/tlshd/tlshd.conf
      #   securityContext:
      #     privileged: true
      #     capabilities:
      #       add:
      #       - NET_ADMIN
      #   volumeMounts:
      #   - name: tlshd-config
      #     mountPath: /etc/tlshd
      #     readOnly: true
      
      - name: csi-node-driver-registrar
        image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.10.0
        args:
        - "--csi-address=unix:///csi/csi.sock"
        - "--kubelet-registration-path=/var/lib/kubelet/plugins/abe.csi.briankmatheson/csi.sock"
        volumeMounts:
        - name: plugin-dir
          mountPath: /csi
        - name: registration-dir
          mountPath: /registration
      volumes:
      - name: plugin-dir
        hostPath:
          path: /var/lib/kubelet/plugins/abe.csi.briankmatheson
          type: DirectoryOrCreate
      - name: registration-dir
        hostPath:
          path: /var/lib/kubelet/plugins_registry
          type: Directory
      - name: mountpoint-dir
        hostPath:
          path: /var/lib/kubelet/pods
          type: Directory
      - name: dev
        hostPath:
          path: /dev
      - name: modules
        hostPath:
          path: /lib/modules
      - name: abe-state
        hostPath:
          path: /var/lib/abe-csi/node
          type: DirectoryOrCreate
      # - name: tlshd-config
      #   configMap:
      #     name: tlshd-config
