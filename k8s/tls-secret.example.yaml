---
# Example secret containing a TLS PSK for NVMe/TCP connections
# Generate a PSK with: nvme gen-tls-key --output=- | base64 -w0
#
# For production, create this secret securely:
#   PSK=$(nvme gen-tls-key --output=- | base64 -w0)
#   kubectl create secret generic abe-nvme-tls \
#     --from-literal=psk="$PSK" \
#     --namespace=kube-system
#
# Reference in StorageClass via:
#   csi.storage.k8s.io/node-publish-secret-name: abe-nvme-tls
#   csi.storage.k8s.io/node-publish-secret-namespace: kube-system
apiVersion: v1
kind: Secret
metadata:
  name: abe-nvme-tls
  namespace: kube-system
type: Opaque
stringData:
  # TLS Pre-Shared Key (base64-encoded)
  # This is a placeholder - generate a real key!
  psk: "REPLACE_WITH_ACTUAL_PSK_BASE64"
