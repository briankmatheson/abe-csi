# How abe-csi reaches xdebbied. Copy, fill in, apply as kube-system/abe-csi-xdebbie.
#   url:   xdebbied as seen from the VMs (the overlay gateway), https
#   token: XDEBBIE_TOKEN from /etc/xdebbie/xdebbie_env on the hypervisor
#   ca:    the xdebbie API CA, /etc/xdebbie/api-ca.pem on the hypervisor
#          (what signed xdebbied's certificate; optional for http urls)
apiVersion: v1
kind: Secret
metadata:
  name: abe-csi-xdebbie
  namespace: kube-system
type: Opaque
stringData:
  url: https://10.23.0.1:7443
  token: change-me
  ca: |
    -----BEGIN CERTIFICATE-----
    ...contents of /etc/xdebbie/api-ca.pem...
    -----END CERTIFICATE-----
