# How abe-csi reaches xdebbied. Copy, fill in, apply as kube-system/abe-csi-xdebbie.
#   url:   xdebbied as seen from the VMs (the overlay gateway)
#   token: XDEBBIE_TOKEN from /etc/xdebbie/xdebbie_env on the hypervisor
apiVersion: v1
kind: Secret
metadata:
  name: abe-csi-xdebbie
  namespace: kube-system
type: Opaque
stringData:
  url: http://10.23.0.1:7443
  token: change-me
