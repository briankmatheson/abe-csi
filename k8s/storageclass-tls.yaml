---
# StorageClass with TLS-enabled NVMe/TCP connections
#
# Requirements:
# - Kubernetes nodes running kernel 6.7+
# - nvme-cli >= 2.8 with TLS support
# - tlshd daemon running on nodes
# - ABE server configured for TLS
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: abe-tls
provisioner: csi.abe.brianmatheson.com
allowVolumeExpansion: false
volumeBindingMode: WaitForFirstConsumer
parameters:
  # ABE host address (comma/space-separated list, first is used)
  hosts: "10.23.0.100"
  
  # Filesystem type to create on first use
  fsType: ext4
  
  # Enable TLS 1.3 for NVMe/TCP connections
  tls: "true"
  
  # Reference to secret containing TLS PSK
  # The secret should have a 'psk' or 'tls-psk' key with the base64-encoded PSK
  csi.storage.k8s.io/node-publish-secret-name: abe-nvme-tls
  csi.storage.k8s.io/node-publish-secret-namespace: kube-system

---
# StorageClass with both TLS and LUKS encryption
# This provides defense in depth: transport layer (TLS) + at-rest (LUKS)
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: abe-tls-luks
provisioner: csi.abe.brianmatheson.com
allowVolumeExpansion: false
volumeBindingMode: WaitForFirstConsumer
parameters:
  hosts: "10.23.0.100"
  fsType: ext4
  tls: "true"
  
  # Reference to secret containing both TLS PSK and LUKS passphrase
  # Secret should have keys:
  #   - tls-psk: base64-encoded TLS PSK
  #   - passphrase: LUKS encryption passphrase
  csi.storage.k8s.io/node-publish-secret-name: abe-combined-secrets
  csi.storage.k8s.io/node-publish-secret-namespace: kube-system
