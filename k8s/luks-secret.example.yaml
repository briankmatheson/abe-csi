# Create the real one out-of-band, e.g.:
#   kubectl -n kube-system create secret generic abe-luks \
#     --from-literal=passphrase="$(openssl rand -base64 48)"
# Losing this passphrase loses every volume encrypted with it.
apiVersion: v1
kind: Secret
metadata:
  name: abe-luks
  namespace: kube-system
type: Opaque
stringData:
  passphrase: CHANGE-ME
