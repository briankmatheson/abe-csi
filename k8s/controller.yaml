apiVersion: apps/v1
kind: Deployment
metadata:
  name: abe-csi-controller
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: abe-csi-controller
  template:
    metadata:
      labels:
        app: abe-csi-controller
    spec:
      serviceAccountName: csi-controller-sa
      containers:
      - name: abe-csi
        image: registry.internal.timesink.harlem.brianmatheson.com/abe-csi:latest
        args:
        - "--endpoint=unix:///csi/csi.sock"
        volumeMounts:
        - name: socket-dir
          mountPath: /csi
        - name: abe-state
          mountPath: /var/lib/abe
      - name: csi-provisioner
        image: registry.k8s.io/sig-storage/csi-provisioner:v5.0.1
        args:
        - "--csi-address=unix:///csi/csi.sock"
        - "--v=5"
        # Covers ABE's fio characterization (ABE_FIO_SECONDS, default 5s)
        # on top of lvcreate/export.
        - "--timeout=120s"
        - "--feature-gates=Topology=true"
        volumeMounts:
        - name: socket-dir
          mountPath: /csi
      volumes:
      # Private to this pod: only the provisioner sidecar talks to the
      # controller socket. Sharing the kubelet plugin dir here would make the
      # controller and node processes fight over the same csi.sock.
      - name: socket-dir
        emptyDir: {}
      - name: abe-state
        hostPath:
          path: /var/lib/abe-csi/controller
          type: DirectoryOrCreate

