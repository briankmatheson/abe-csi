apiVersion: apps/v1
kind: Deployment
metadata:
  name: abe-csi-controller
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: abe-csi-controller
  template:
    metadata:
      labels:
        app: abe-csi-controller
    spec:
      serviceAccountName: csi-controller-sa
      priorityClassName: system-cluster-critical
      # Single-node clusters have only a tainted control plane
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      containers:
      - name: abe-csi
        image: registry.mesh.harlem.bmath.nyc/abe-csi:0.3.2
        args:
        - "--endpoint=unix:///csi/csi.sock"
        env:
        - name: XDEBBIE_URL
          valueFrom:
            secretKeyRef: {name: abe-csi-xdebbie, key: url}
        - name: XDEBBIE_TOKEN
          valueFrom:
            secretKeyRef: {name: abe-csi-xdebbie, key: token}
        volumeMounts:
        - name: socket-dir
          mountPath: /csi
      - name: csi-provisioner
        image: registry.k8s.io/sig-storage/csi-provisioner:v5.0.1
        args:
        - "--csi-address=unix:///csi/csi.sock"
        - "--v=5"
        # Covers ABE's fio characterization (ABE_FIO_SECONDS, default 5s)
        # on top of lvcreate/export.
        - "--timeout=120s"
        - "--feature-gates=Topology=true"
        volumeMounts:
        - name: socket-dir
          mountPath: /csi
      volumes:
      # Private to this pod: only the provisioner sidecar talks to the
      # controller socket. Sharing the kubelet plugin dir here would make the
      # controller and node processes fight over the same csi.sock.
      - name: socket-dir
        emptyDir: {}

